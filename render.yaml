services:
  - type: web
    name: test-coverage
    env: static
    plan: free
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    # SPAではないため rewrite 不要（index/suggest/admin はそれぞれ実ファイル）
    # 環境変数は Renderダッシュボード > Environment で設定してください
    # VITE_FIREBASE_API_KEY, VITE_FIREBASE_AUTH_DOMAIN, VITE_FIREBASE_PROJECT_ID,
    # VITE_FIREBASE_STORAGE_BUCKET, VITE_FIREBASE_MESSAGING_SENDER_ID,
    # VITE_FIREBASE_APP_ID, VITE_FIREBASE_MEASUREMENT_ID
    # VITE_AI_MODE=local（推奨・完全無料） / cloudflare（Workers AI・任意） / cloud（Gemini Functions・任意）
    # cloudflare の場合: VITE_CLOUDFLARE_AI_URL=https://exam-coach-ai.your-subdomain.workers.dev
    # 未設定でもデモモード（モックデータ）で表示されます
