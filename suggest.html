<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>変更点を提案 — テスト範囲表</title>
  <meta name="theme-color" content="#f8fafc">
  <script>try{const t=localStorage.getItem('exam_theme')|| (localStorage.getItem('exam_dark_mode')==='true'?'dark':'light'); if(t==='dark'){document.documentElement.classList.add('dark'); document.documentElement.setAttribute('data-theme','dark'); document.querySelector('meta[name="theme-color"]').setAttribute('content','#070A14')}else{document.documentElement.setAttribute('data-theme','light')}}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body class="min-h-screen">
  <div class="bg-mesh"></div><div class="bg-grid"></div>
  <header class="header-glass">
    <div class="max-w-[980px] mx-auto px-4 h-[60px] flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-cyan-400 to-violet-500 grid place-items-center text-white font-black text-sm shadow-glow">T</div>
        <div class="leading-none"><div class="font-extrabold text-[15px]">変更点を提案</div><div class="text-[11px] tracking-widest font-semibold text-zinc-400">SUGGEST EDIT</div></div>
      </a>
      <div class="flex items-center gap-1.5">
        <div id="accountContainer" class="flex items-center gap-1.5"></div>
        <a href="index.html" class="px-3 py-1.5 rounded-full bg-white text-zinc-900 text-xs font-bold inline-flex items-center gap-1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" class="w-3.5 h-3.5"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg> トップ</a>
      </div>
    </div>
  </header>

  <main class="max-w-[720px] mx-auto px-3 sm:px-4 py-6">
    <div class="glass rounded-[24px] p-5 sm:p-7">
      <div class="flex items-start gap-3">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-br from-pink-400 to-violet-500 grid place-items-center text-white"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7V16a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2v-1.3A7 7 0 0 0 12 2z"/></svg></div>
        <div>
          <h1 class="text-lg font-black">テスト範囲表の修正・追加を提案</h1>
          <p class="text-sm text-zinc-400 mt-1 leading-relaxed">範囲表に誤りや追加したい情報がある場合はこちらから送信してください。管理者が確認後、反映されます。</p>
        </div>
      </div>

      <div id="errorBox" class="hidden mt-4 px-3 py-2 rounded-xl bg-red-500/15 border border-red-500/20 text-sm text-red-300 flex gap-2 items-center"><span class="w-4 h-4"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg></span><span id="errorMessage"></span></div>

      <form id="suggestForm" novalidate class="mt-6 space-y-4">
        <div>
          <label class="text-xs font-bold tracking-wide text-zinc-300">提案の種類 <span class="text-red-400">*</span></label>
          <div class="flex gap-3 mt-2">
            <label class="flex-1 flex items-center gap-2 p-3 rounded-2xl border cursor-pointer has-[:checked]:bg-cyan-500/10 has-[:checked]:border-cyan-400/30 border-white/10 bg-white/[0.03]">
              <input type="radio" name="sugType" value="test_scope" checked class="accent-cyan-400">
              <span class="text-sm font-semibold inline-flex items-center gap-1.5"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5V4.5A2.5 2.5 0 0 1 6.5 2z"/><path d="M8 7h8"/><path d="M8 11h8"/></svg> 範囲変更</span>
            </label>
            <label class="flex-1 flex items-center gap-2 p-3 rounded-2xl border cursor-pointer has-[:checked]:bg-violet-500/10 has-[:checked]:border-violet-400/30 border-white/10 bg-white/[0.03]">
              <input type="radio" name="sugType" value="submission" class="accent-violet-400">
              <span class="text-sm font-semibold inline-flex items-center gap-1.5"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M10 13H8"/><path d="M16 17H8"/><path d="M13 13h3"/></svg> 提出物</span>
            </label>
          </div>
        </div>

        <div class="grid sm:grid-cols-2 gap-4">
          <div>
            <label class="text-xs font-bold tracking-wide text-zinc-300">対象の定期テスト <span class="text-red-400">*</span></label>
            <select id="sugVersion" class="input mt-1.5"><option>読み込み中…</option></select>
          </div>
          <div>
            <label class="text-xs font-bold tracking-wide text-zinc-300">コース <span class="text-red-400">*</span></label>
            <select id="sugCourse" class="input mt-1.5">
              <option value="">選択してください</option>
              <option value="K/文系">K/文系</option>
              <option value="K/理系（物理）">K/理系（物理）</option>
              <option value="K/理系（生物）">K/理系（生物）</option>
              <option value="SS/理系（物理）">SS/理系（物理）</option>
              <option value="SS/理系（生物）">SS/理系（生物）</option>
            </select>
          </div>
        </div>

        <div>
          <label class="text-xs font-bold tracking-wide text-zinc-300">教科 <span class="text-red-400">*</span></label>
          <select id="sugSubject" class="input mt-1.5"><option value="">先にコースを選択してください</option></select>
        </div>

        <div id="scopeFields" class="space-y-4">
          <div class="grid sm:grid-cols-2 gap-4">
            <div><label class="text-xs font-bold text-zinc-300">日程</label><input id="sugDate" class="input mt-1.5" placeholder="例: 9/10(水)"></div>
            <div><label class="text-xs font-bold text-zinc-300">時限</label><input id="sugPeriod" class="input mt-1.5" placeholder="例: 2限"></div>
          </div>
          <div><label class="text-xs font-bold text-zinc-300">範囲</label><textarea id="sugScope" class="input mt-1.5 min-h-[88px]" placeholder="例: 教科書 p.10〜45&#10;ワーク p.2〜20" rows="3"></textarea></div>
          <div><label class="text-xs font-bold text-zinc-300">備考</label><textarea id="sugNotes" class="input mt-1.5" placeholder="テスト形式や注意事項など" rows="2"></textarea></div>
        </div>

        <div id="submissionFields" class="hidden">
          <div><label class="text-xs font-bold text-zinc-300">提出物の詳細 <span class="text-red-400">*</span></label><textarea id="sugSubNotes" class="input mt-1.5 min-h-[88px]" placeholder="提出物の内容、期限など" rows="3"></textarea></div>
        </div>

        <button type="submit" id="submitBtn" class="btn-primary w-full !py-3 text-[15px]">提案を送信する</button>
        <p class="text-[11px] text-zinc-500 text-center">ログインが必要です。未ログインの場合はログインを求められます。</p>
      </form>

      <div id="loading" class="hidden py-10 grid place-items-center gap-3">
        <div class="w-8 h-8 rounded-full border-2 border-white/15 border-t-cyan-400 animate-spin"></div>
        <div class="text-sm text-zinc-400">送信中…</div>
      </div>

      <div id="successState" class="hidden py-8 text-center">
        <div class="w-14 h-14 rounded-full bg-emerald-500/15 border border-emerald-500/20 grid place-items-center mx-auto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-7 h-7 text-emerald-400"><path d="M5 13l4 4L19 7"/></svg></div>
        <h3 class="font-black mt-3">提案を送信しました！</h3>
        <p class="text-sm text-zinc-400 mt-1">管理者が確認後、反映されます</p>
        <div class="flex gap-2 justify-center mt-5">
          <a href="index.html" class="btn-ghost">トップに戻る</a>
          <button onclick="resetSuggestionForm()" class="btn-primary">別の提案を送る</button>
        </div>
      </div>
    </div>
  </main>

  <!-- Auth Modals (same as index) -->
  <div id="loginModal" class="modal-backdrop hidden"><div class="modal-card"><h3 class="text-lg font-black text-center">ログイン</h3><p class="text-sm text-zinc-400 text-center mt-1">提案にはログインが必要です</p><div id="loginError" class="hidden mt-3 px-3 py-2 rounded-xl bg-red-500/15 border border-red-500/20 text-sm text-red-300"></div><div class="mt-4 space-y-3"><input id="loginEmail" type="email" placeholder="example@mail.com" class="input"><input id="loginPassword" type="password" placeholder="パスワード" class="input"><button id="loginSubmitBtn" class="btn-primary w-full">ログイン</button><div class="text-center text-sm text-zinc-400">アカウントをお持ちでない方は <a id="loginToRegister" class="font-bold text-white hover:underline cursor-pointer">新規登録</a></div></div></div></div>
  <div id="registerModal" class="modal-backdrop hidden"><div class="modal-card"><h3 class="text-lg font-black text-center">新規登録</h3><div id="regError" class="hidden mt-3 px-3 py-2 rounded-xl bg-red-500/15 border border-red-500/20 text-sm text-red-300"></div><div class="mt-4 space-y-3"><input id="regDisplayName" type="text" placeholder="表示名" class="input"><input id="regEmail" type="email" placeholder="example@mail.com" class="input"><input id="regPassword" type="password" placeholder="8文字以上" class="input"><button id="regSubmitBtn" class="btn-primary w-full">登録</button><div class="text-center text-sm text-zinc-400">すでにアカウントをお持ちの方は <a id="registerToLogin" class="font-bold text-white hover:underline cursor-pointer">ログイン</a></div></div></div></div>
  <div id="forgotPasswordModal" class="modal-backdrop hidden"><div class="modal-card"><h3 class="text-lg font-black text-center">パスワードリセット</h3><div id="forgotError" class="hidden mt-3 px-3 py-2 rounded-xl bg-red-500/15 border border-red-500/20 text-sm text-red-300"></div><div id="forgotSuccess" class="hidden mt-3 px-3 py-2 rounded-xl bg-emerald-500/15 border border-emerald-500/20 text-sm text-emerald-200"></div><div class="mt-4 space-y-3"><input id="forgotEmail" type="email" placeholder="example@mail.com" class="input"><button id="forgotSubmitBtn" class="btn-primary w-full">リセットメールを送信</button><div class="text-center"><a id="forgotToLogin" class="text-sm text-zinc-400 hover:text-white cursor-pointer">ログインに戻る</a></div></div></div></div>
  <div id="resetPasswordModal" class="modal-backdrop hidden"><div class="modal-card"><h3 class="text-lg font-black text-center">新しいパスワード</h3><div id="resetError" class="hidden mt-3 px-3 py-2 rounded-xl bg-red-500/15 border border-red-500/20 text-sm text-red-300"></div><div id="resetSuccess" class="hidden mt-3 px-3 py-2 rounded-xl bg-emerald-500/15 border border-emerald-500/20 text-sm text-emerald-200"></div><div class="mt-4 space-y-3"><input id="resetPassword" type="password" placeholder="新しいパスワード" class="input"><input id="resetPasswordConfirm" type="password" placeholder="もう一度入力" class="input"><button id="resetSubmitBtn" class="btn-primary w-full">変更</button></div></div></div>

  <script type="module" src="/src/suggest.js"></script>
</body>
</html>
